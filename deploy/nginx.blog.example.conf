# Mounting this blog app under https://www.softsuave.com/blog while the existing
# website keeps serving everything else.
#
# Regenerate the redirect map whenever posts are added at the OLD root URLs:
#   node scripts/gen-blog-redirects.mjs > deploy/blog_redirects.map
#
# Note there is no `location /uploads/` block. Media URLs are prefixed inside the
# app (see src/lib/media-url.ts), so images are served through /blog/uploads/*
# like any other app route — nothing extra to expose from disk.

# ── http block ───────────────────────────────────────────────────────────────
# Legacy root-level blog URLs. Empty (falsy) for every path that is not a blog URL,
# so the existing website is untouched.
map $uri $blog_redirect {
    default        "";
    include        /etc/nginx/blog_redirects.map;
}

# ── inside the primary `server` block for www.softsuave.com ──────────────────

    # 301 legacy blog URLs to their /blog equivalents. `if` + `return` is one of the
    # two officially supported uses of `if` in a location-less context, so this is
    # safe. $is_args$args preserves query strings — without it every UTM-tagged
    # inbound link loses its parameters.
    if ($blog_redirect) {
        return 301 $blog_redirect$is_args$args;
    }

    # Convenience redirect for existing team bookmarks to the old dashboard URL.
    # 302 rather than 301, deliberately: unlike the post URLs above this carries no
    # SEO weight, and a cached 301 on an admin entry point is unrevokable if the
    # mount point ever changes again.
    location = /admin {
        return 302 /blog/admin;
    }
    location ^~ /admin/ {
        return 302 /blog$request_uri;
    }

    # The blog application. One block covers pages, /blog/_next/* assets,
    # /blog/uploads/* media, /blog/api/*, and /blog/admin.
    location /blog/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # /blog with no trailing slash — the archive itself.
    location = /blog {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

# ── the primary site's own robots.txt, at the domain root ────────────────────
# Crawlers only ever read https://www.softsuave.com/robots.txt, so the app's own
# /blog/robots.txt is never fetched. Append these to the ROOT file:
#
#   Disallow: /blog/admin/
#   Disallow: /blog/api/
#   Disallow: /blog/preview/
#
#   Sitemap: https://www.softsuave.com/blog/sitemap.xml
