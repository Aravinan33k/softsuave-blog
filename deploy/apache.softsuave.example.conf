# Serving the migrated pages of www.softsuave.com from this app, and nothing else.
#
# The live box fronts the site with Apache (vhost /etc/apache2/sites-enabled/softsuave.conf,
# DocumentRoot /var/www/newhtml, PHP-FPM). This is an ALLOWLIST: a request goes to this
# app only when its exact path is listed in softsuave-site-pages.map, or it is one of the
# app's own asset paths below. Everything else keeps its current behaviour:
#
#   /blog, /blogs   the existing blog app on :3100 (its <Location> blocks stay untouched)
#   /forms          the enquiry API on :3000; this app forwards its leads there too
#   (/hire-forward-deployed-engineer left its own app on :3200 on 18 Nov; the page is in the map
#   as /hire-forward-deployed-engineers since 25 Nov)
#   every other URL the PHP site: unmigrated pages, old /ad/* pages, *.php, /assets/*
#                   files PHP has, robots.txt, sitemap.xml, favicon.ico, and 404s
#
# Install (once):
#   1. Copy softsuave-site-pages.map to /etc/apache2/softsuave-site-pages.map with only the
#      batch you are switching (start with an empty file to install the rules safely).
#   2. Paste the block below inside <VirtualHost *:443>, after the existing ProxyPass and
#      <Location> lines. Requires mod_rewrite, mod_proxy, mod_proxy_http (all loaded).
#   3. apache2ctl configtest && systemctl reload apache2
#
# Switch more pages: add their lines to the map file. Apache re-reads it on change.
# Roll back a page: delete its line. Roll back everything: empty the map file.
#
# The app listens on 127.0.0.1:3300 (PM2 process softsuave-site).

# ── inside <VirtualHost *:443> for www.softsuave.com ────────────────────────────

    # ---- softsuave-site (Next.js app on 127.0.0.1:3300) ----
    RewriteEngine On
    RewriteMap softsuaveSite "txt:/etc/apache2/softsuave-site-pages.map"

    # 0. Same host as the PHP site: its .htaccess 301s softsuave.com and the server IP to
    #    www, but .htaccess never runs for proxied requests, so listed pages do it here.
    RewriteCond "%{HTTP_HOST}" "!^www\.softsuave\.com(?::443)?$" [NC]
    RewriteCond "${softsuaveSite:%{REQUEST_URI}|php}" "=app"
    RewriteRule "^" "https://www.softsuave.com%{REQUEST_URI}" [R=301,L]

    # 0b. Portfolio pages taken offline (17 Nov): /portfolio and its 18 /portfolio-* project
    #     pages. Their PHP files stay in the docroot; the URLs 301 to the case studies.
    RewriteRule "^/portfolio(?:-[A-Za-z0-9-]+)?(?:\.php)?/?$" "https://www.softsuave.com/case-studies" [R=301,NC,QSD,L]

    # 0c. SEO team's requests (18 Nov). Query strings (utm, gclid) are kept on the redirects.
    RewriteRule "^/ai-development-service(?:\.php)?/?$" "https://www.softsuave.com/custom-ai-development-services" [R=301,NC,L]
    RewriteRule "^/hire-salesforce-developers(?:\.php)?/?$" "https://www.softsuave.com/hire-salesforce-developer" [R=301,NC,L]
    # Forward Deployed Engineers lives at the plural URL (25 Nov). The singular, and any other
    # spelling of the plural ("/", ".php", capitals), 301 to it. The exact plural goes to the app (rule 1).
    RewriteRule "^/hire-forward-deployed-engineer(?:\.php)?/?$" "https://www.softsuave.com/hire-forward-deployed-engineers" [R=301,NC,L]
    RewriteCond "%{REQUEST_URI}" "!^/hire-forward-deployed-engineers$"
    RewriteRule "^/hire-forward-deployed-engineers(?:\.php)?/?$" "https://www.softsuave.com/hire-forward-deployed-engineers" [R=301,NC,L]
    # The ad page too (25 Nov): plural "engineers" 301s to the singular URL, any case, with "/" or ".php".
    RewriteRule "^/ad/hire-forward-deployed-engineers(?:\.php)?/?$" "https://www.softsuave.com/ad/hire-forward-deployed-engineer" [R=301,NC,L]
    # Deleted: 410 Gone (tells search engines the page is removed for good).
    RewriteRule "^/generative-ai-integration-service(?:\.php)?/?$" - [G,NC,L]
    # The app page whose path is also a PHP docroot folder (it holds /php, /angular, ... subpages):
    # .htaccess never 301s "folder/" to "folder", so the old PHP index answered there (19 Nov audit).
    RewriteRule "^/offshore-software-development-company/$" "https://www.softsuave.com/offshore-software-development-company" [R=301,L]

    # 1. Switched pages: the exact path is in the map. Query strings pass through.
    RewriteCond "${softsuaveSite:%{REQUEST_URI}|php}" "=app"
    RewriteRule "^" "http://127.0.0.1:3300%{REQUEST_URI}" [P,L]

    # 2. /assets/ is shared with the PHP site. PHP's file wins when it exists; the
    #    app's own files (case-study PDFs and images, none of which PHP has) go to the app.
    RewriteCond "%{REQUEST_URI}" "^/assets/"
    RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}" "!-f"
    RewriteRule "^" "http://127.0.0.1:3300%{REQUEST_URI}" [P,L]

    # 3. What the app's pages load. None of these paths exist on the PHP site.
    ProxyPassMatch "^/(_next/.*)$" "http://127.0.0.1:3300/$1"
    ProxyPassMatch "^/((?:brand|email|images|videos)/.*)$" "http://127.0.0.1:3300/$1"
    ProxyPassMatch "^/(og(?:/.*)?)$" "http://127.0.0.1:3300/$1"
    ProxyPassMatch "^/(icon\.svg|apple-icon\.png|path-to-final-(?:graphql|postgresql)-og-image\.webp)$" "http://127.0.0.1:3300/$1"

    # 4. The public APIs the app's forms, scheduler and chat call. The rest of /api/
    #    (admin, auth, cron) is not exposed.
    ProxyPassMatch "^/(api/v1/(?:enquiry|career|chat|geo|meeting)(?:/.*)?)$" "http://127.0.0.1:3300/$1"

    # Redirects from the app (for example "/x/" to "/x") come back as this host.
    ProxyPassReverse / http://127.0.0.1:3300/
    # ---- end softsuave-site ----
