# Serving www.softsuave.com from this app while the old PHP site keeps the pages
# that were never migrated.
#
# On the live box Apache fronts the site (vhost `softsuave.conf`, DocumentRoot
# /var/www/newhtml with PHP-FPM). Today it proxies only /blog and /blogs to the old
# blog app (:3100), /forms to the enquiry API (:3000) and
# /hire-forward-deployed-engineer to its own app (:3200), and serves everything else
# from PHP. After the cut-over this app answers every path EXCEPT the carve-outs
# below, which Apache keeps serving from the PHP docroot exactly as it does now.
#
# What stays on PHP, and why (SEO page sheet, rows marked "Not yet migrated - need
# to retain old PHP pages", that have no page in this app):
#   * 22 pages: /portfolio, the 18 /portfolio-* case pages, /construction-product,
#     /field-tracking-product, /developer-rate-card.
#   * Every *.php URL: those pages' forms post to email-sender.php, mailer.php and
#     thank-you.php (resources-minified/js/email-utility.js, new-fadin.js).
#   * The static folders those pages load: /new-assets/, /new-site/, /resources/,
#     /resources-minified/, /ad-page-assets/, /assets/icon/, six files under
#     /assets/images/ and three favicons. None of them exists in this app's public/.
#   * The old /ad/* and /ads/* PHP landing pages, except the 21 /ad/* pages this app
#     now serves itself (listed in the first rule).
#
# Pages that the sheet calls "not yet migrated" but this app already has (for
# example /hire-cms-developer, /magento-development, /softsuave-career) are served
# by this app on purpose.
#
# Requires: mod_proxy, mod_proxy_http, mod_headers.
# Replace 127.0.0.1:3100 with wherever this app listens. 3100 is the old blog app's
# port; this app replaces that app, because it serves /blog itself.
# ProxyPass rules are matched in the order written, and the first match wins.

# ── inside the existing <VirtualHost *:443> for www.softsuave.com ───────────────

    ProxyRequests     Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Remove the old per-app rules first:
    #   ProxyPass /blog  http://127.0.0.1:3100/blog    (this app serves /blog itself)
    #   ProxyPass /blogs http://127.0.0.1:3100/blogs
    #   ProxyPass /hire-forward-deployed-engineer http://127.0.0.1:3200/...

    # 1. The enquiry API keeps its own app (unchanged from today).
    ProxyPass        /forms http://127.0.0.1:3000/forms
    ProxyPassReverse /forms http://127.0.0.1:3000/forms

    # 2. The /ad/* pages this app serves. Must come before the /ad/ carve-out below.
    #    The trailing slash is captured and passed on, because the app redirects
    #    /ad/x to /ad/x/ (trailingSlash: true).
    ProxyPassMatch "^(/ad/(?:ai-solution|android-development-company|app-developer|app-development-company-india|hire-ai-developer|hire-dedicated-developer|hire-forward-deployed-engineer|hire-full-stack-developers|hire-java-developers|hire-mobile-app-developers|hire-remote-developers-india|hire-salesforce-developer|ios-development-company|it-staff-augmentation-services|mvp-development|on-demand-app-development-company|remote-angular-developers|remote-developer|remote-developers|software-developer|staff-augmentation)/?)$" "http://127.0.0.1:3100$1"

    # 3. Carve-outs: "!" means Apache serves the path from the PHP docroot itself.
    ProxyPassMatch "\.php$" "!"
    ProxyPassMatch "^/(?:portfolio(?:-[A-Za-z0-9-]+)?|construction-product|field-tracking-product|developer-rate-card)/?$" "!"
    ProxyPass /ad/                 !
    ProxyPass /ads/                !
    ProxyPass /new-assets/         !
    ProxyPass /new-site/           !
    ProxyPass /resources/          !
    ProxyPass /resources-minified/ !
    ProxyPass /ad-page-assets/     !
    ProxyPass /assets/icon/        !
    ProxyPassMatch "^/assets/images/(?:hire-steps-mobile|hire-steps-web|madhu-manager|og-img-ai-solution|og-img-field-tracking-solution|twitter-new)\.webp$" "!"
    ProxyPassMatch "^/(?:favicon\.svg|favicon\.png|apple-touch-icon\.png)$" "!"

    # 4. Everything else is this app: the homepage, the 197 content pages, /blog and
    #    its posts, /_next/*, /uploads/*, /api/*, /admin, robots.txt and sitemap.xml.
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/
