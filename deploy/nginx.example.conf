# Serving this application at the domain root of https://www.softsuave.com.
#
# The app owns every path: "/" is the marketing homepage, "/blog" the post
# archive, "/<slug>" posts and pages, "/admin" the dashboard, "/uploads/*" media,
# "/api/*" the API. Nothing is carved out for another backend, and there is no
# `basePath` in next.config.ts to keep in sync with a location prefix.
#
# Note there is no `location /uploads/` block. Media is served by the app itself
# (see src/lib/media-url.ts), so nothing extra is exposed from disk.
#
# ── legacy URLs ──────────────────────────────────────────────────────────────
# Two generations of URL are retired in the app, not here, so a single
# `next.config.ts` holds the whole map (see its `redirects()`):
#
#   * The WordPress-era root URLs (/my-post, /category/x) are not redirects at
#     all — the app answers them natively, which is why it moved back to the root.
#   * The brief basePath '/blog' mount published /blog/my-post, /blog/admin and
#     friends; those 301 (302 for admin) to their root equivalents.
#
# Do NOT reintroduce an nginx-level /<slug> → /blog/<slug> map: the app now serves
# the root form and redirects the /blog form, so the pair would form a loop.

# ── inside the primary `server` block for www.softsuave.com ──────────────────

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

# ── robots.txt and sitemap.xml ───────────────────────────────────────────────
# Both are app routes now (src/app/robots.ts, src/app/sitemap.ts) and are served
# from the root, so crawlers read the app's own copies:
#
#   https://www.softsuave.com/robots.txt
#   https://www.softsuave.com/sitemap.xml
#
# Any static /robots.txt left behind by the previous website must be removed, or
# nginx will keep serving it in preference to the app's.
